<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Deals PK | Smart Online Shopping</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f4f6; color: #212121; padding-bottom: 80px; }
        
        /* Header Layout */
        .header { background: linear-gradient(135deg, #f57224, #ff4500); padding: 12px 15px; color: white; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .lang-select { background: #fff; color: #f57224; border: none; padding: 5px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .header h1 { font-size: 16px; font-weight: bold; }
        
        /* Cart & Admin Red Dot Container */
        .cart-wrapper { display: flex; align-items: center; gap: 8px; position: relative; }
        .cart-icon-btn { background: #fff; color: #f57224; border: none; padding: 6px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 12px; }
        
        /* Red Dot Button */
        .red-dot-btn {
            width: 14px;
            height: 14px;
            background-color: #ff0000;
            border-radius: 50%;
            border: 2px solid #ffffff;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0,0,0,0.3);
            display: inline-block;
            transition: transform 0.2s;
        }
        .red-dot-btn:hover { transform: scale(1.3); }

        .container { max-width: 480px; margin: 10px auto; padding: 0 10px; }
        
        /* Product Cards */
        .product-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 3px 10px rgba(0,0,0,0.08); border: 1px solid #e2e2e2; }
        .main-img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; border: 1px solid #eee; }
        .thumb-row { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; }
        .thumb { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; cursor: pointer; border: 2px solid #ddd; }

        .title { font-size: 15px; font-weight: bold; margin: 10px 0 5px 0; line-height: 1.3; }
        .price-box { margin-bottom: 12px; }
        .price { font-size: 20px; font-weight: bold; color: #f57224; }
        .old-price { font-size: 13px; color: #888; text-decoration: line-through; margin-left: 5px; }

        .bank-info { background: #eef2f5; padding: 10px; border-radius: 6px; font-size: 12px; margin: 10px 0; line-height: 1.4; border-left: 4px solid #25D366; }

        .btn-group { display: flex; gap: 8px; }
        .btn-cart { flex: 1; background: #ffe8de; color: #f57224; border: 1px solid #f57224; padding: 12px 5px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; text-align: center; }
        .btn-buy { flex: 1; background: #f57224; color: white; border: none; padding: 12px 5px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; text-align: center; }

        /* Modal Popups */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; border-radius: 12px; padding: 20px; width: 90%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; text-align: center; color: #f57224; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #333; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        
        .payment-box { background: #fff3cd; border: 1px solid #ffeeba; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 12px; }
        .payment-box strong { color: #856404; }

        .btn-submit { background: #25D366; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-update { background: #f57224; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-close { background: #888; color: white; border: none; width: 100%; padding: 8px; border-radius: 8px; font-size: 13px; cursor: pointer; margin-top: 5px; }
        .error-msg { color: red; font-size: 11px; display: none; margin-top: 3px; }
    </style>
</head>
<body>

<div class="header">
    <select class="lang-select" id="langSelect" onchange="toggleLanguage()">
        <option value="en">English</option>
        <option value="ur">اردو</option>
    </select>
    <h1>SMART DEALS PK</h1>
    <div class="cart-wrapper">
        <!-- Red Dot for Admin Add Product -->
        <span class="red-dot-btn" id="adminRedDot" title="Add New Product" onclick="openAddProductModal()"></span>
        <button class="cart-icon-btn" id="cartBtn" onclick="openCartModal()">🛒 <span id="cart-lbl">Cart</span> (<span id="cart-count">0</span>)</button>
    </div>
</div>

<div class="container" id="productList">
    <!-- Products will render dynamically -->
</div>

<!-- ADD NEW PRODUCT MODAL (ADMIN) -->
<div class="modal-overlay" id="addProductModal">
    <div class="modal-content">
        <div class="modal-title">Add New Product</div>
        <form id="newProductForm" onsubmit="saveNewProduct(event)">
            <div class="form-group">
                <label>Product Title (English) *</label>
                <input type="text" id="npTitleEn" required placeholder="e.g. New Wireless Earbuds">
            </div>
            <div class="form-group">
                <label>Product Title (Urdu)</label>
                <input type="text" id="npTitleUr" placeholder="e.g. نئے وائرلیس ایئربڈز">
            </div>
            <div class="form-group">
                <label>Price (Rs.) *</label>
                <input type="number" id="npPrice" required placeholder="e.g. 1500">
            </div>
            <div class="form-group">
                <label>Old Price / Original Price (Rs.)</label>
                <input type="number" id="npOldPrice" placeholder="e.g. 3000">
            </div>
            <div class="form-group">
                <label>Photo 1 URL / Image Link *</label>
                <input type="text" id="npImg1" required placeholder="Paste image link here">
            </div>
            <div class="form-group">
                <label>Photo 2 URL / Image Link (Optional)</label>
                <input type="text" id="npImg2" placeholder="Paste image link here">
            </div>
            <div class="form-group">
                <label>Photo 3 URL / Image Link (Optional)</label>
                <input type="text" id="npImg3" placeholder="Paste image link here">
            </div>

            <button type="submit" class="btn-update">🚀 Update Website</button>
            <button type="button" class="btn-close" onclick="closeAddProductModal()">Close</button>
        </form>
    </div>
</div>

<!-- CHECKOUT / ORDER MODAL -->
<div class="modal-overlay" id="checkoutModal">
    <div class="modal-content">
        <div class="modal-title" id="lbl-modal-title">Complete Order</div>
        <form id="orderForm" onsubmit="submitOrder(event)">
            <div class="form-group">
                <label id="lbl-items">Selected Item(s)</label>
                <input type="text" id="orderItems" readonly style="background:#eee;">
            </div>
            <div class="form-group">
                <label id="lbl-total">Total Amount</label>
                <input type="text" id="orderTotal" readonly style="background:#eee; font-weight:bold; color:#f57224;">
            </div>
            <div class="form-group">
                <label id="lbl-name">Full Name *</label>
                <input type="text" id="custName" required placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label id="lbl-email">Email Address *</label>
                <input type="email" id="custEmail" required placeholder="example@email.com">
                <span class="error-msg" id="emailError">Please enter a valid email domain (e.g. gmail.com)</span>
            </div>
            <div class="form-group">
                <label id="lbl-phone">WhatsApp / Phone Number *</label>
                <input type="tel" id="custPhone" required placeholder="03001234567">
            </div>
            <div class="form-group">
                <label id="lbl-address">Full Delivery Address *</label>
                <textarea id="custAddress" rows="2" required placeholder="House No, Street, City"></textarea>
            </div>
            
            <!-- IMPROVED PAYMENT METHOD SELECTOR -->
            <div class="form-group">
                <label id="lbl-pay-method">Select Payment Method *</label>
                <select id="paymentMethod" onchange="updatePaymentDetails()">
                    <option value="EasyPaisa">EasyPaisa (03711965637)</option>
                    <option value="JazzCash">JazzCash (03711965637)</option>
                    <option value="Bank Transfer">Bank Transfer (Ask on WhatsApp)</option>
                </select>
            </div>

            <div class="payment-box">
                <p><strong id="lbl-pay-check">Payment Instructions:</strong><br>
                Send Rs. <span id="paymentAmount">0</span> via <span id="selectedPayMethodName">EasyPaisa</span> to <strong>03711965637</strong> and enter details below.</p>
            </div>

            <div class="form-group">
                <label id="lbl-sender">Your Sender Account Number / Name *</label>
                <input type="text" id="senderAccount" required placeholder="0300XXXXXXX or Account Title">
            </div>
            <div class="form-group">
                <label id="lbl-trx">Transaction ID / TRX ID *</label>
                <input type="text" id="trxId" required placeholder="e.g. 2839102831">
            </div>

            <button type="submit" class="btn-submit" id="lbl-btn-submit">✅ Place Order via WhatsApp</button>
            <button type="button" class="btn-close" onclick="closeModal()" id="lbl-btn-close">Close</button>
        </form>
    </div>
</div>

<script>
    // 1. Initial Default Products List (Guaranteed Safe)
    const defaultProducts = [
        {
            id: 1,
            title_en: "Moisturizing Spa Gel Socks (Silicon Feet Care)",
            title_ur: "موئسچرائزنگ سپا جیل ساکس (سلیکون پاؤں کی دیکھ بھال)",
            price: 500,
            oldPrice: 1000,
            images: ["./IMG_20260929_072619.jpg", "./IMG_20260929_072633.jpg"]
        },
        {
            id: 2,
            title_en: "Purple Teeth Whitening Strips (Colour Corrector)",
            title_ur: "پرپل ٹیتھ وائٹننگ سٹرپس (کلر کریکٹر)",
            price: 500,
            oldPrice: 1000,
            images: ["./Screenshot_2026-09-29-07-31-23-90.jpg", "./Screenshot_2026-09-29-07-31-36-45.jpg"]
        },
        {
            id: 3,
            title_en: "Sank Magic Practice Copybook Set - 4 Books + Pen",
            title_ur: "سینک میجک پریکٹس کاپی بک سیٹ - 4 بکس + پین",
            price: 500,
            oldPrice: 714,
            images: ["https://i.ibb.co/G4bBTKtK/image1.jpg", "https://i.ibb.co/N6GfYySv/image2.jpg"]
        },
        {
            id: 4,
            title_en: "Kids DIY Instant Print Digital Camera",
            title_ur: "بچوں کا ڈیجیٹل کیمرہ (انسٹنٹ پرنٹ)",
            price: 3500,
            oldPrice: 7000,
            images: ["https://i.ibb.co/Rpj3P9Tn/cam1.jpg", "https://i.ibb.co/dw1gTTJM/cam2.jpg"]
        }
    ];

    let productsData = [];

    // Combine local storage products with default products without losing defaults
    function loadProducts() {
        const saved = localStorage.getItem('custom_products_v2');
        if (saved) {
            try {
                const custom = JSON.parse(saved);
                productsData = [...custom, ...defaultProducts];
            } catch(e) {
                productsData = [...defaultProducts];
            }
        } else {
            productsData = [...defaultProducts];
        }
    }

    let currentLang = 'en';
    let cart = [];

    // Render Products Dynamic Function
    window.renderProducts = function() {
        const container = document.getElementById('productList');
        if (!container) return;
        container.innerHTML = '';

        productsData.forEach(p => {
            const title = (currentLang === 'ur' && p.title_ur) ? p.title_ur : p.title_en;
            const btnCartText = currentLang === 'ur' ? '🛒 کارٹ میں شامل کریں' : '🛒 Add to Cart';
            const btnBuyText = currentLang === 'ur' ? '⚡ ابھی خریدیں' : '⚡ Buy Now';
            const payText = currentLang === 'ur' ? 'ایزی پیسہ / جیز کیش: <strong>03711965637</strong> (پہلے پیمنٹ بھیجیں)' : 'EasyPaisa / JazzCash: <strong>03711965637</strong> (Send Payment First)';

            let thumbsHtml = '';
            if (p.images && p.images.length > 0) {
                thumbsHtml = p.images.map(img => img ? `<img src="${img}" class="thumb" onclick="changeImage('p${p.id}-main', '${img}')">` : '').join('');
            }

            const mainImgSrc = (p.images && p.images[0]) ? p.images[0] : 'https://via.placeholder.com/250';

            container.innerHTML += `
                <div class="product-card">
                    <img id="p${p.id}-main" src="${mainImgSrc}" class="main-img" alt="${title}">
                    <div class="thumb-row">${thumbsHtml}</div>
                    <div class="title">${title}</div>
                    <div class="price-box"><span class="price">Rs. ${p.price}</span> ${p.oldPrice ? `<span class="old-price">Rs. ${p.oldPrice}</span>` : ''}</div>
                    <div class="bank-info">${payText}</div>
                    <div class="btn-group">
                        <button class="btn-cart" onclick="addToCart(${p.id})">${btnCartText}</button>
                        <button class="btn-buy" onclick="buyNow(${p.id})">${btnBuyText}</button>
                    </div>
                </div>
            `;
        });
    };

    // Language Selector Toggle
    window.toggleLanguage = function() {
        currentLang = document.getElementById('langSelect').value;
        document.getElementById('cart-lbl').innerText = currentLang === 'ur' ? 'کارٹ' : 'Cart';
        
        document.getElementById('lbl-modal-title').innerText = currentLang === 'ur' ? 'آرڈر مکمل کریں' : 'Complete Order';
        document.getElementById('lbl-items').innerText = currentLang === 'ur' ? 'منتخب شدہ آئٹمز' : 'Selected Item(s)';
        document.getElementById('lbl-total').innerText = currentLang === 'ur' ? 'کل رقم' : 'Total Amount';
        document.getElementById('lbl-name').innerText = currentLang === 'ur' ? 'پورا نام *' : 'Full Name *';
        document.getElementById('lbl-email').innerText = currentLang === 'ur' ? 'ای میل ایڈریس *' : 'Email Address *';
        document.getElementById('lbl-phone').innerText = currentLang === 'ur' ? 'واٹس ایپ / فون نمبر *' : 'WhatsApp / Phone Number *';
        document.getElementById('lbl-address').innerText = currentLang === 'ur' ? 'مکمل پتہ *' : 'Full Delivery Address *';
        document.getElementById('lbl-sender').innerText = currentLang === 'ur' ? 'آپ کا اکاؤنٹ نمبر (جس سے پیسے بھیجے) *' : 'Your Account Number *';
        document.getElementById('lbl-trx').innerText = currentLang === 'ur' ? 'ٹرانزیکشن آئی ڈی / TRX ID *' : 'Transaction ID / TRX ID *';
        document.getElementById('lbl-btn-submit').innerText = currentLang === 'ur' ? '✅ واٹس ایپ پر آرڈر بھیجیں' : '✅ Place Order via WhatsApp';
        document.getElementById('lbl-btn-close').innerText = currentLang === 'ur' ? 'بند کریں' : 'Close';

        renderProducts();
    };

    // Admin Add Product Modal Handlers
    window.openAddProductModal = function() {
        document.getElementById('addProductModal').style.display = 'flex';
    };

    window.closeAddProductModal = function() {
        document.getElementById('addProductModal').style.display = 'none';
    };

    window.saveNewProduct = function(e) {
        e.preventDefault();
        
        const titleEn = document.getElementById('npTitleEn').value;
        const titleUr = document.getElementById('npTitleUr').value || titleEn;
        const price = parseFloat(document.getElementById('npPrice').value);
        const oldPrice = document.getElementById('npOldPrice').value ? parseFloat(document.getElementById('npOldPrice').value) : null;
        
        const img1 = document.getElementById('npImg1').value;
        const img2 = document.getElementById('npImg2').value;
        const img3 = document.getElementById('npImg3').value;

        const imgs = [img1, img2, img3].filter(img => img && img.trim() !== '');

        const newProd = {
            id: Date.now(),
            title_en: titleEn,
            title_ur: titleUr,
            price: price,
            oldPrice: oldPrice,
            images: imgs
        };

        const savedCustom = JSON.parse(localStorage.getItem('custom_products_v2') || '[]');
        savedCustom.unshift(newProd);
        localStorage.setItem('custom_products_v2', JSON.stringify(savedCustom));

        loadProducts();
        renderProducts();
        closeAddProductModal();
        document.getElementById('newProductForm').reset();
        alert('Product added successfully!');
    };

    window.changeImage = function(targetId, src) {
        const el = document.getElementById(targetId);
        if (el) el.src = src;
    };

    window.addToCart = function(productId) {
        const product = productsData.find(p => p.id == productId);
        if (product) {
            cart.push(product);
            updateCartUI();
            alert(currentLang === 'ur' ? 'آئٹم کارٹ میں شامل ہو گیا۔' : 'Item added to cart!');
        }
    };

    function updateCartUI() {
        document.getElementById('cart-count').innerText = cart.length;
    }

    window.openCartModal = function() {
        if (cart.length === 0) {
            alert(currentLang === 'ur' ? 'آپ کا کارٹ خالی ہے۔' : 'Your cart is empty!');
            return;
        }
        let itemsList = cart.map(item => (currentLang === 'ur' && item.title_ur) ? item.title_ur : item.title_en).join(', ');
        let total = cart.reduce((sum, item) => sum + item.price, 0);
        openCheckout(itemsList, total);
    };

    window.buyNow = function(productId) {
        const product = productsData.find(p => p.id == productId);
        if (product) {
            let title = (currentLang === 'ur' && product.title_ur) ? product.title_ur : product.title_en;
            openCheckout(title, product.price);
        }
    };

    function openCheckout(items, total) {
        document.getElementById('orderItems').value = items;
        document.getElementById('orderTotal').value = 'Rs. ' + total;
        document.getElementById('paymentAmount').innerText = total;
        updatePaymentDetails();
        document.getElementById('checkoutModal').style.display = 'flex';
    }

    window.closeModal = function() {
        document.getElementById('checkoutModal').style.display = 'none';
    };

    window.updatePaymentDetails = function() {
        const method = document.getElementById('paymentMethod').value;
        document.getElementById('selectedPayMethodName').innerText = method;
    };

    function isValidEmail(ema
