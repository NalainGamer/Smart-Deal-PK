<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Order</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .order-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .order-card h2 {
            text-align: center;
            color: #1a2536;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .product-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: #16a34a;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            color: #334155;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #25d366;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }

        .btn-whatsapp {
            width: 100%;
            background-color: #25d366;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }

        .btn-whatsapp:hover {
            background-color: #20bd5a;
        }

        .contact-info {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #64748b;
        }

        .contact-info a {
            color: #25d366;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="order-card">
        <h2>Complete Your Order</h2>

        <!-- Product Information Header -->
        <div class="product-box">
            <div class="product-title">Sank Magic Practice Copybook Set - 4 Books with Pen & 10 Refills</div>
            <div class="product-price">Price: 500 Rupees</div>
        </div>

        <!-- Order Form -->
        <form id="orderForm">
            <div class="form-group">
                <label for="fullName">Aap Ka Naam (Full Name):</label>
                <input type="text" id="fullName" placeholder="Ali Khan" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" placeholder="03001234567" required>
            </div>

            <div class="form-group">
                <label for="address">Complete Address (Ghar ka pata):</label>
                <textarea id="address" placeholder="House #, Street #, Area, City" required></textarea>
            </div>

            <div class="form-group">
                <label for="paymentMethod">Payment Method:</label>
                <select id="paymentMethod" required>
                    <option value="JazzCash">JazzCash</option>
                    <option value="EasyPaisa">EasyPaisa</option>
                </select>
            </div>

            <button type="button" class="btn-whatsapp" onclick="sendToWhatsApp()">Order Via WhatsApp</button>
        </form>

        <div class="contact-info">
            For more details contact seller WhatsApp:<br>
            <a href="https://wa.me/923711965637" target="_blank">+92 3711965637</a>
        </div>
    </div>

    <script>
        function sendToWhatsApp() {
            const name = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            const payment = document.getElementById('paymentMethod').value;

            if (!name || !phone || !address) {
                alert('Please fill out all fields before submitting.');
                return;
            }

            const sellerNumber = "923711965637";

            const message = `*New Order Details*%0A%0A` +
                `*Product:* Sank Magic Practice Copybook Set - 4 Books with Pen & 10 Refills%0A` +
                `*Price:* 500 Rupees%0A%0A` +
                `*Customer Details:*%0A` +
                `• *Name:* ${encodeURIComponent(name)}%0A` +
                `• *Phone:* ${encodeURIComponent(phone)}%0A` +
                `• *Address:* ${encodeURIComponent(address)}%0A` +
                `• *Payment Method:* ${encodeURIComponent(payment)}`;

            window.open(`https://wa.me/${sellerNumber}?text=${message}`, '_blank');
        }
    </script>

</body>
            </html>
