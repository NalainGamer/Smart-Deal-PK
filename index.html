<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Deals PK</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0e12;
            color: #ffffff;
            padding: 15px;
            padding-bottom: 90px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #16181f;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #232733;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #282c3c;
            margin-bottom: 15px;
        }
        .brand-title {
            background: linear-gradient(45deg, #FF9800, #FF5722);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 22px;
            font-weight: 800;
        }
        .lang-select {
            background: #222634;
            color: #00E676;
            border: 1px solid #00E676;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }
        .product-card {
            background: #1e2230;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #2b3044;
        }
        .main-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }
        .thumbnails {
            display: flex;
            gap: 8px;
            margin: 10px 0;
        }
        .thumb {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            cursor: pointer;
            object-fit: cover;
            border: 2px solid transparent;
            opacity: 0.7;
        }
        .thumb.active {
            border-color: #00E676;
            opacity: 1;
        }
        .product-title {
            font-size: 15px;
            font-weight: 600;
            margin: 8px 0;
            line-height: 1.4;
            color: #e2e8f0;
        }
        .price-tag {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .discount-badge {
            background: #ff1744;
            color: #fff;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }
        .product-price {
            color: #00E676;
            font-weight: 800;
            font-size: 18px;
        }
        .original-price {
            text-decoration: line-through;
            color: #64748b;
            font-size: 13px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn-buy {
            flex: 1;
            background: linear-gradient(135deg, #FF9800, #F57C00);
            color: #fff;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.3);
        }
        .btn-cart {
            flex: 1;
            background: linear-gradient(135deg, #2979ff, #1565c0);
            color: #fff;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(41, 121, 255, 0.3);
        }
        
        /* Floating Cart */
        .floating-cart {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #00E676;
            color: #000;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 230, 118, 0.4);
            z-index: 999;
        }
        .cart-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #ff1744;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            border-radius: 50%;
            padding: 3px 7px;
        }

        /* Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 15px;
        }
        .modal-overlay.active {
            display: flex !important;
        }
        .modal-content {
            background: #181b26;
            padding: 22px;
            border-radius: 16px;
            width: 100%;
            max-width: 430px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #2d3348;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #94a3b8;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 6px;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #0f111a;
            border: 1px solid #2a3045;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #00E676;
        }

        /* Cool Note Box */
        .cool-note-box {
            background: linear-gradient(135deg, #0e2a1f, #071a13);
            border: 1px solid #00E676;
            padding: 14px;
            border-radius: 10px;
            margin: 15px 0;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.15);
        }
        .note-header {
            color: #00E676;
            font-size: 15px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }
        .acc-highlight {
            background: #00E676;
            color: #000;
            font-size: 16px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            display: inline-block;
            margin: 6px 0;
            letter-spacing: 1px;
        }
        .note-text {
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.5;
        }

        .btn-confirm {
            width: 100%;
            background: linear-gradient(135deg, #00E676, #00b0ff);
            color: #000;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.4);
            text-transform: uppercase;
        }
        
        .rtl {
            direction: rtl;
            text-align: right;
        }
        .rtl .close-btn {
            left: 15px;
            right: auto;
        }
    </style>
</head>
<body id="bodyTag">

<div class="container">
    <div class="header">
        <h2 class="brand-title">Smart Deals PK</h2>
        <select class="lang-select" id="langSelector">
            <option value="en">⚡ English</option>
            <option value="ur">🇵🇰 اردو</option>
        </select>
    </div>

    <!-- Product 1 -->
    <div class="product-card">
        <img id="img1" src="https://i.ibb.co/G4bBTKtK/image1.jpg" class="main-img">
        <div class="thumbnails">
            <img src="https://i.ibb.co/G4bBTKtK/image1.jpg" class="thumb active" onclick="setImg('img1', this)">
            <img src="https://i.ibb.co/N6GfYySv/image2.jpg" class="thumb" onclick="setImg('img1', this)">
        </div>
        <div class="product-title" id="t1">Sank Magic Practice Copybook Set - 4 Books with Pen & 10 Refills</div>
        <div class="price-tag">
            <span class="discount-badge" id="disc1">30% OFF</span>
            <span class="product-price">Rs. 500</span>
            <span class="original-price">Rs. 714</span>
        </div>
        <div class="btn-group">
            <button type="button" class="btn-buy btnBuyText" onclick="buyDirect(1)">Buy Now</button>
            <button type="button" class="btn-cart btnCartText" onclick="addCartItem(1)">Add To Cart</button>
        </div>
    </div>

    <!-- Product 2 -->
    <div class="product-card">
        <img id="img2" src="https://i.ibb.co/Rpj3P9Tn/cam1.jpg" class="main-img">
        <div class="thumbnails">
            <img src="https://i.ibb.co/Rpj3P9Tn/cam1.jpg" class="thumb active" onclick="setImg('img2', this)">
            <img src="https://i.ibb.co/dw1gTTJM/cam2.jpg" class="thumb" onclick="setImg('img2', this)">
            <img src="https://i.ibb.co/WvhZzHxC/cam3.jpg" class="thumb" onclick="setImg('img2', this)">
        </div>
        <div class="product-title" id="t2">Kids DIY Instant Digital Camera with Photo Printing (Random Color)</div>
        <div class="price-tag">
            <span class="discount-badge" id="disc2">50% OFF</span>
            <span class="product-price">Rs. 3,500</span>
            <span class="original-price">Rs. 7,000</span>
        </div>
        <div class="btn-group">
            <button type="button" class="btn-buy btnBuyText" onclick="buyDirect(2)">Buy Now</button>
            <button type="button" class="btn-cart btnCartText" onclick="addCartItem(2)">Add To Cart</button>
        </div>
    </div>
</div>

<!-- Floating Cart Button -->
<div class="floating-cart" onclick="openCartModal()">
    🛒 <span class="cart-badge" id="cCount">0</span>
</div>

<!-- Cart Modal -->
<div class="modal-overlay" id="cartModal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('cartModal')">&times;</span>
        <h3 id="cartHeaderTitle" style="color: #00E676;">Shopping Cart</h3>
        <br>
        <div id="cartList" style="color: #94a3b8;">Cart is empty</div>
        <br>
        <h4 style="display:flex; justify-content:space-between; border-top:1px solid #2d3348; padding-top:10px;">
            <span id="cartTotalText">Total</span>
            <span style="color: #00E676;">Rs. <span id="cTotal">0</span></span>
        </h4>
        <br>
        <button type="button" class="btn-buy" id="btnProceedCart" style="width: 100%;" onclick="checkoutCart()">Proceed to Checkout</button>
    </div>
</div>

<!-- Checkout Modal -->
<div class="modal-overlay" id="checkoutModal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('checkoutModal')">&times;</span>
        <h3 id="checkoutHeaderTitle" style="color:#FF9800; margin-bottom:12px;">Checkout Details</h3>

        <form onsubmit="finishOrder(event)">
            <div class="form-group">
                <label id="lbl1">Full Name *</label>
                <input type="text" id="custName" placeholder="e.g. Nalain" required>
            </div>
            <div class="form-group">
                <label id="lbl2">Phone / WhatsApp Number *</label>
                <input type="tel" id="custPhone" placeholder="03XXXXXXXXX" required>
            </div>
            <div class="form-group">
                <label id="lbl3">Full Delivery Address *</label>
                <textarea id="custAddress" rows="2" placeholder="House #, Street #, City" required></textarea>
            </div>
            <div class="form-group">
                <label id="lbl4">Select Online Payment Method *</label>
                <select id="payMethod" onchange="renderPaymentBox()" required>
                    <option value="">-- Choose Payment --</option>
                    <option value="EasyPaisa">EasyPaisa</option>
                    <option value="JazzCash">JazzCash</option>
                </select>
            </div>

            <!-- Cool Payment Box -->
            <div class="cool-note-box" id="payBox" style="display:none;">
                <div class="note-header" id="pBoxTitle">⚡ Quick Payment Steps</div>
                <div class="note-text" id="pBoxDesc"></div>
                <div class="form-group" style="margin-top: 12px; margin-bottom: 0;">
                    <label id="lbl5" style="color:#00E676;">Account / Phone Number *</label>
                    <input type="tel" id="accountNum" placeholder="03XXXXXXXXX">
                </div>
            </div>

            <button type="submit" class="btn-confirm" id="btnSubmit">Pay & Complete Order</button>
        </form>
    </div>
</div>

<script>
    let cart = [];
    let currentOrder = [];

    const productData = {
        1: {
            en: "Sank Magic Practice Copybook Set - 4 Books with Pen & 10 Refills",
            ur: "Sank Magic Copybook Set - 4 کتابیں، 1 پین اور 10 ریفلز",
            price: 500
        },
        2: {
            en: "Kids DIY Instant Digital Camera with Photo Printing (Random Color)",
            ur: "بچوں کا ڈیجیٹل پرنٹنگ کیمرہ (مختلف رنگ)",
            price: 3500
        }
    };

    const translations = {
        en: {
            disc1: "30% OFF",
            disc2: "50% OFF",
            buyBtn: "Buy Now",
            cartBtn: "Add To Cart",
            cartHeader: "Shopping Cart",
            cartEmpty: "Cart is empty",
            cartTotal: "Total Amount",
            proceedBtn: "Proceed to Checkout",
            checkoutHeader: "Checkout Details",
            lbl1: "Full Name *",
            lbl2: "Phone / WhatsApp Number *",
            lbl3: "Full Delivery Address *",
            lbl4: "Select Online Payment Method *",
            lbl5: "EasyPaisa / Sender Mobile Number *",
            btnSubmit: "Pay & Complete Order",
            addedMsg: " added to cart!"
        },
        ur: {
            disc1: "30% چھوٹ",
            disc2: "50% چھوٹ",
            buyBtn: "ابھی خریدیں",
            cartBtn: "کارٹ میں شامل کریں",
            cartHeader: "آپ کا کارٹ",
            cartEmpty: "کارٹ خالی ہے",
            cartTotal: "کل رقم",
            proceedBtn: "آرڈر مکمل کریں",
            checkoutHeader: "ڈلیوری اور پیمنٹ کی تفصیلات",
            lbl1: "پورا نام *",
            lbl2: "فون / واٹس ایپ نمبر *",
            lbl3: "مکمل پتہ *",
            lbl4: "آن لائن ادائیگی کا طریقہ منتخب کریں *",
            lbl5: "ایزی پیسہ / بھیجنے والا نمبر *",
            btnSubmit: "ادائیگی کریں اور آرڈر واٹس ایپ کریں",
            addedMsg: " کارٹ میں شامل کر دیا گیا ہے!"
        }
    };

    document.getElementById('langSelector').addEventListener('change', switchLanguage);

    function setImg(id, el) {
        document.getElementById(id).src = el.src;
        let thumbs = el.parentElement.getElementsByClassName('thumb');
        for(let t of thumbs) t.classList.remove('active');
        el.classList.add('active');
    }

    function addCartItem(productId) {
        let lang = document.getElementById('langSelector').value;
        let p = productData[productId];
        cart.push({id: productId, title: p[lang], price: p.price});
        document.getElementById('cCount').innerText = cart.length;
        alert(p[lang] + translations[lang].addedMsg);
    }

    function openCartModal() {
        let lang = document.getElementById('langSelector').value;
        let list = document.getElementById('cartList');
        let total = 0;
        if(cart.length === 0) {
            list.innerHTML = translations[lang].cartEmpty;
        } else {
            list.innerHTML = '';
            cart.forEach((item) => {
                total += item.price;
                list.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:8px; color:#fff;">
                    <span>${item.title}</span>
                    <b style="color:#00E676;">Rs. ${item.price}</b>
                </div>`;
            });
        }
        document.getElementById('cTotal').innerText = total;
        document.getElementById('cartModal').classList.add('active');
    }

    function checkoutCart() {
        let lang = document.getElementById('langSelector').value;
        if(cart.length === 0) {
            alert(translations[lang].cartEmpty);
            return;
        }
        currentOrder = [...cart];
        closeModal('cartModal');
        document.getElementById('checkoutModal').classList.add('active');
    }

    function buyDirect(productId) {
        let lang = document.getElementById('langSelector').value;
        let p = productData[productId];
        currentOrder = [{id: productId, title: p[lang], price: p.price}];
        document.getElementById('checkoutModal').classList.add('active');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    function renderPaymentBox() {
        let m = document.getElementById('payMethod').value;
        let box = document.getElementById('payBox');
        let lang = document.getElementById('langSelector').value;
        let desc = document.getElementById('pBoxDesc');

        if(m === "EasyPaisa" || m === "JazzCash") {
            box.style.display = 'block';
            let total = currentOrder.reduce((s, i) => s + i.price, 0);

            if(lang === 'ur') {
                document.getElementById('pBoxTitle').innerText = '⚡ ' + m + ' سے ادائیگی کی ہدایات';
                desc.innerHTML = `
                    کل رقم <b style="color:#FF9800;">Rs. ${total}</b> درج ذیل اکاؤنٹ پر منتقل کریں:<br>
                    <div class="acc-highlight">03711965637</div><br>
                    اپنا ${m} اکاؤنٹ نمبر درج کریں، آرڈر کنفرم ہوتے ہی EasyPaisa / WhatsApp par Redirect ho jayega!
                `;
            } else {
                document.getElementById('pBoxTitle').innerText = '⚡ ' + m + ' Payment Instructions';
                desc.innerHTML = `
                    Transfer total amount <b style="color:#FF9800;">Rs. ${total}</b> to official account:<br>
                    <div class="acc-highlight">03711965637</div><br>
                    Enter your ${m} number below and click confirm to proceed.
                `;
            }
        } else {
            box.style.display = 'none';
        }
    }

    function finishOrder(e) {
        e.preventDefault();
        let name = document.getElementById('custName').value;
        let phone = document.getElementById('custPhone').value;
        let address = document.getElementById('custAddress').value;
        let method = document.getElementById('payMethod').value;
        let accNum = document.getElementById('accountNum').value;

        let total = currentOrder.reduce((s, i) => s + i.price, 0);
        let items = currentOrder.map(i => i.title + " (Rs. " + i.price + ")").join(", ");

        let msg = "*NEW ONLINE ORDER*%0A%0A" +
            "*Items:* " + encodeURIComponent(items) + "%0A" +
            "*Total Amount:* Rs. " + total + "%0A" +
