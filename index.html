<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Deals PK</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0c0e14;
            color: #ffffff;
            padding: 15px;
            padding-bottom: 90px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #151821;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #232838;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #252a3b;
            margin-bottom: 15px;
        }
        .brand-title {
            background: linear-gradient(45deg, #FF9800, #FF5722);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 22px;
            font-weight: 800;
        }
        .lang-select {
            background: #1f2332;
            color: #00E676;
            border: 1px solid #00E676;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }
        .product-card {
            background: #1b1f2e;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #282d42;
        }
        .main-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }
        .thumbnails {
            display: flex;
            gap: 8px;
            margin: 10px 0;
        }
        .thumb {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            cursor: pointer;
            object-fit: cover;
            border: 2px solid transparent;
            opacity: 0.7;
        }
        .thumb.active {
            border-color: #00E676;
            opacity: 1;
        }
        .product-title {
            font-size: 15px;
            font-weight: 600;
            margin: 8px 0;
            line-height: 1.4;
            color: #e2e8f0;
        }
        .price-tag {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .discount-badge {
            background: #ff1744;
            color: #fff;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 20px;
        }
        .product-price {
            color: #00E676;
            font-weight: 800;
            font-size: 18px;
        }
        .original-price {
            text-decoration: line-through;
            color: #64748b;
            font-size: 13px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn-buy, .btn-cart {
            flex: 1;
            color: #fff;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-buy {
            background: linear-gradient(135deg, #FF9800, #F57C00);
        }
        .btn-cart {
            background: linear-gradient(135deg, #2979ff, #1565c0);
        }
        
        .floating-cart {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00E676;
            color: #000;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            z-index: 99;
        }
        .cart-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #ff1744;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            border-radius: 50%;
            padding: 3px 7px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }
        .modal-overlay.active {
            display: flex !important;
        }
        .modal-content {
            background: #171a26;
            padding: 22px;
            border-radius: 16px;
            width: 100%;
            max-width: 430px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid #2d3348;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #94a3b8;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 6px;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #0d0f17;
            border: 1px solid #2a3045;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .cool-note-box {
            background: #0e2a1f;
            border: 1px solid #00E676;
            padding: 14px;
            border-radius: 10px;
            margin: 15px 0;
        }
        .acc-highlight {
            background: #00E676;
            color: #000;
            font-size: 16px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            display: inline-block;
            margin: 6px 0;
        }
        .btn-confirm {
            width: 100%;
            background: linear-gradient(135deg, #00E676, #00b0ff);
            color: #000;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 class="brand-title">Smart Deals PK</h2>
        <select class="lang-select" id="langSelector">
            <option value="en">⚡ English</option>
            <option value="ur">🇵🇰 اردو</option>
        </select>
    </div>

    <!-- Product 1 -->
    <div class="product-card">
        <img id="img1" src="https://i.ibb.co/G4bBTKtK/image1.jpg" class="main-img">
        <div class="thumbnails">
            <img src="https://i.ibb.co/G4bBTKtK/image1.jpg" class="thumb active" data-target="img1">
            <img src="https://i.ibb.co/N6GfYySv/image2.jpg" class="thumb" data-target="img1">
        </div>
        <div class="product-title" id="t1">Sank Magic Practice Copybook Set - 4 Books with Pen & 10 Refills</div>
        <div class="price-tag">
            <span class="discount-badge" id="disc1">30% OFF</span>
            <span class="product-price">Rs. 500</span>
            <span class="original-price">Rs. 714</span>
        </div>
        <div class="btn-group">
            <button type="button" class="btn-buy" id="buyBtn1">Buy Now</button>
            <button type="button" class="btn-cart" id="cartBtn1">Add To Cart</button>
        </div>
    </div>

    <!-- Product 2 -->
    <div class="product-card">
        <img id="img2" src="https://i.ibb.co/Rpj3P9Tn/cam1.jpg" class="main-img">
        <div class="thumbnails">
            <img src="https://i.ibb.co/Rpj3P9Tn/cam1.jpg" class="thumb active" data-target="img2">
            <img src="https://i.ibb.co/dw1gTTJM/cam2.jpg" class="thumb" data-target="img2">
            <img src="https://i.ibb.co/WvhZzHxC/cam3.jpg" class="thumb" data-target="img2">
        </div>
        <div class="product-title" id="t2">Kids DIY Instant Digital Camera with Photo Printing (Random Color)</div>
        <div class="price-tag">
            <span class="discount-badge" id="disc2">50% OFF</span>
            <span class="product-price">Rs. 3,500</span>
            <span class="original-price">Rs. 7,000</span>
        </div>
        <div class="btn-group">
            <button type="button" class="btn-buy" id="buyBtn2">Buy Now</button>
            <button type="button" class="btn-cart" id="cartBtn2">Add To Cart</button>
        </div>
    </div>
</div>

<div class="floating-cart" id="floatingCart">
    🛒 <span class="cart-badge" id="cCount">0</span>
</div>

<!-- Cart Modal -->
<div class="modal-overlay" id="cartModal">
    <div class="modal-content">
        <span class="close-btn" id="closeCart">&times;</span>
        <h3 style="color: #00E676;">Shopping Cart</h3>
        <br>
        <div id="cartList" style="color: #94a3b8;">Cart is empty</div>
        <br>
        <h4 style="display:flex; justify-content:space-between; border-top:1px solid #2d3348; padding-top:10px;">
            <span>Total</span>
            <span style="color: #00E676;">Rs. <span id="cTotal">0</span></span>
        </h4>
        <br>
        <button type="button" class="btn-buy" id="btnProceedCart" style="width: 100%;">Proceed to Checkout</button>
    </div>
</div>

<!-- Checkout Modal -->
<div class="modal-overlay" id="checkoutModal">
    <div class="modal-content">
        <span class="close-btn" id="closeCheckout">&times;</span>
        <h3 style="color:#FF9800; margin-bottom:12px;">Checkout Details</h3>

        <form id="orderForm">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="custName" placeholder="e.g. Nalain" required>
            </div>
            <div class="form-group">
                <label>Phone / WhatsApp Number *</label>
                <input type="tel" id="custPhone" placeholder="03XXXXXXXXX" required>
            </div>
            <div class="form-group">
                <label>Full Delivery Address *</label>
                <textarea id="custAddress" rows="2" placeholder="House #, Street #, City" required></textarea>
            </div>
            <div class="form-group">
                <label>Select Online Payment Method *</label>
                <select id="payMethod" required>
                    <option value="">-- Choose Payment --</option>
                    <option value="EasyPaisa">EasyPaisa</option>
                    <option value="JazzCash">JazzCash</option>
                </select>
            </div>

            <div class="cool-note-box" id="payBox" style="display:none;">
                <div style="color:#00E676; font-weight:800; margin-bottom:8px;">⚡ Payment Instructions</div>
                <div style="color: #cbd5e1; font-size: 13px;" id="pBoxDesc"></div>
                <div class="form-group" style="margin-top: 12px; margin-bottom: 0;">
                    <label style="color:#00E676;">Account / Phone Number *</label>
                    <input type="tel" id="accountNum" placeholder="03XXXXXXXXX">
                </div>
            </div>

            <button type="submit" class="btn-confirm">Pay & Complete Order</button>
        </form>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    let cart = [];
    let activeOrder = [];

    const productData = {
        1: { title: "Sank Magic Practice Copybook Set - 4 Books with Pen & 10 Refills", price: 500 },
        2: { title: "Kids DIY Instant Digital Camera with Photo Printing (Random Color)", price: 3500 }
    };

    // Thumbnail Clicks
    document.querySelectorAll('.thumb').forEach(thumb => {
        thumb.addEventListener('click', function() {
            let targetId = this.getAttribute('data-target');
            document.getElementById(targetId).src = this.src;
            this.parentElement.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
        });
    });

    // Add To Cart Buttons
    document.getElementById('cartBtn1').addEventListener('click', () => addToCart(1));
    document.getElementById('cartBtn2').addEventListener('click', () => addToCart(2));

    // Buy Now Buttons
    document.getElementById('buyBtn1').addEventListener('click', () => buyNow(1));
    document.getElementById('buyBtn2').addEventListener('click', () => buyNow(2));

    // Modals Open/Close
    document.getElementById('floatingCart').addEventListener('click', openCart);
    document.getElementById('closeCart').addEventListener('click', () => closeModal('cartModal'));
    document.getElementById('closeCheckout').addEventListener('click', () => closeModal('checkoutModal'));
    document.getElementById('btnProceedCart').addEventListener('click', proceedCheckout);

    function addToCart(id) {
        cart.push(productData[id]);
        document.getElementById('cCount').innerText = cart.length;
        alert(productData[id].title + " added to cart!");
    }

    function buyNow(id) {
        activeOrder = [productData[id]];
        document.getElementById('checkoutModal').classList.add('active');
        updatePaymentDetails();
    }

    function openCart() {
        let listDiv = document.getElementById('cartList');
        let total = 0;

        if (cart.length === 0) {
            listDiv.innerHTML = "Cart is empty";
        } else {
            listDiv.innerHTML = '';
            cart.forEach(item => {
                total += item.price;
                listDiv.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                    <span>${item.title}</span>
                    <b style="color:#00E676;">Rs. ${item.price}</b>
                </div>`;
            });
        }
        document.getElementById('cTotal').innerText = total;
        document.getElementById('cartModal').classList.add('active');
    }

    function proceedCheckout() {
        if (cart.length === 0) {
            alert("Cart is empty!");
            return;
        }
        activeOrder = [...cart];
        closeModal('cartModal');
        document.getElementById('checkoutModal').classList.add('active');
        updatePaymentDetails();
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    document.getElementById('payMethod').addEventListener('change', updatePaymentDetails);

    function updatePaymentDetails() {
        let method = document.getElementById('payMethod').value;
        let box = document.getElementById('payBox');
        let desc = document.getElementById('pBoxDesc');

        if (method === "EasyPaisa" || method === "JazzCash") {
            box.style.display = 'block';
            let total = activeOrder.reduce((sum, item) => sum + item.price, 0);
            desc.innerHTML = `Transfer total <b style="color:#FF9800;">Rs. ${total}</b> to official account:<br><div class="acc-highlight">03711965637</div>`;
        } else {
            box.style.display = 'none';
        }
    }

    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        let name = document.getElementById('custName').value;
        let phone = document.getElementById('custPhone').value;
        let address = document.getElementById('custAddress').value;
        let method = document.getElementById('payMethod').value;
        let accNum = document.getElementById('accountNum').value;

        let total = activeOrder.reduce((sum, item) => sum + item.price, 0);
        let itemsList = activeOrder.map(item => item.title + " (Rs. " + item.price + ")").join(", ");

        let message = "*NEW ONLINE ORDER*%0A%0A" +
            "*Items:* " + encodeURIComponent(itemsList) + "%0A" +
            "*Total Amount:* Rs. " + total + "%0A" +
            "*Name:* " + encodeURIComponent(name) + "%0A" +
            "*Phone:* " + encodeURIComponent(phone) + "%0A" +
            "*Address:* " + encodeURIComponent(address) + "%0A" +
            "*Payment Method:* " + encodeURIComponent(method) + "%0A" +
            "*Sender Account:* " + encodeURIComponent(accNum);

        window.location.href = "https://wa.me/923711965637?text=" + message;
    });
});
</script>

</body>
    </html>
